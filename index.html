<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방역왕 랭킹 | 바퀴벌레 vs 인간</title>
<meta name="description" content="바퀴벌레 vs 인간 | 셀프퇴치 카페 월간 방역왕 랭킹">
<style>
:root{--bg:#0b0f14;--panel:#111821;--line:#243140;--text:#f4f7fb;--muted:#94a3b8;--gold:#ffd34e;--silver:#d7e1ec;--bronze:#d98b52;--accent:#6ee7b7}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(900px 500px at 50% -100px,#173028 0%,transparent 65%),var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
.wrap{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 72px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:24px}
.eyebrow{font-size:13px;color:var(--accent);font-weight:800}.title{font-size:clamp(28px,7vw,48px);line-height:1.04;margin:7px 0 9px;letter-spacing:-.04em;font-weight:950}.sub{color:var(--muted);font-size:14px;line-height:1.6}.month{border:1px solid var(--line);background:#0f151d;color:var(--text);border-radius:12px;padding:10px 12px;font-weight:700}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.podium{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:20px;background:linear-gradient(180deg,#151d27,#0f151d)}.podium:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--medal)}
.podium .rank{font-size:13px;color:var(--muted);font-weight:800}.podium .name{font-size:22px;font-weight:900;margin:8px 0 14px}.podium .score{font-size:36px;font-weight:950}.unit{font-size:13px;color:var(--muted);margin-left:4px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{font-size:12px;color:#cbd5e1;background:#0b1118;border:1px solid #223040;padding:6px 8px;border-radius:999px}.gold{--medal:var(--gold)}.silver{--medal:var(--silver)}.bronze{--medal:var(--bronze)}
.section{margin-top:22px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:rgba(17,24,33,.92)}.section-head{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 14px}.section-title{font-weight:900;font-size:18px}.section-note{color:var(--muted);font-size:12px}
.table{width:100%;border-collapse:collapse}.table th{font-size:11px;color:var(--muted);font-weight:800;text-align:right;padding:10px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.table th:nth-child(1),.table th:nth-child(2){text-align:left}.table td{padding:14px;border-bottom:1px solid rgba(36,49,64,.75);text-align:right;font-size:14px}.table td:nth-child(1),.table td:nth-child(2){text-align:left}.table tr:last-child td{border-bottom:0}.rno{font-weight:900;color:#cbd5e1}.member{font-weight:850}.points{font-weight:950;font-size:17px}.gap{display:inline-flex;color:#fbbf24;background:#3b2d07;border:1px solid #6b520b;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}.stats-mobile{display:none;color:var(--muted);font-size:12px;margin-top:5px}
.history{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 18px 18px}.hist{border:1px solid var(--line);border-radius:14px;padding:13px;background:#0e151c}.hist .h-rank{color:var(--muted);font-size:11px}.hist .h-name{font-weight:850;margin-top:5px}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 18px 18px}.rule{border:1px solid var(--line);border-radius:14px;padding:13px;background:#0e151c}.rule b{display:block;font-size:16px;margin-bottom:3px}.rule span{color:var(--muted);font-size:11px}.error{border:1px solid #61303b;background:#21151a;color:#fecdd3;border-radius:16px;padding:18px;margin-top:20px}
footer{margin-top:24px;color:#64748b;font-size:11px;line-height:1.65;text-align:center}
@media(max-width:720px){.wrap{width:min(100% - 20px,560px);padding-top:20px}header{display:block}.month{display:inline-block;margin-top:12px}.top3{grid-template-columns:1fr}.podium{padding:17px}.table th:nth-child(n+4),.table td:nth-child(n+4){display:none}.table td{padding:14px 12px}.table th{padding:10px 12px}.stats-mobile{display:block}.history{gap:7px;padding:0 12px 12px}.hist{padding:10px}.rules{grid-template-columns:1fr 1fr;padding:0 12px 12px}.section-head{padding:16px 12px 12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="eyebrow">바퀴벌레 vs 인간 | 셀프퇴치</div>
    <div class="title" id="title">방역왕 👑</div>
    <div class="sub">많이 쓰는 것보다, 실제로 서로에게 도움이 된 활동을 더 높게 평가함.</div>
  </div>
  <div class="month" id="month">불러오는 중</div>
</header>

<section class="top3" id="top3"></section>

<section class="section">
  <div class="section-head"><div class="section-title">TOP 10</div><div class="section-note">4위부터 3위까지 남은 점수</div></div>
  <table class="table">
    <thead><tr><th>순위</th><th>닉네임</th><th>점수</th><th>게시글</th><th>유의미 댓글</th><th>전체 댓글</th><th>3위까지</th></tr></thead>
    <tbody id="ranking-body"></tbody>
  </table>
</section>

<section class="section">
  <div class="section-head"><div class="section-title">지난달 방역왕</div><div class="section-note" id="prev-label">-</div></div>
  <div class="history" id="history"></div>
</section>

<section class="section">
  <div class="section-head"><div class="section-title">점수 기준</div><div class="section-note">판정 상세 사유는 공개하지 않음</div></div>
  <div class="rules">
    <div class="rule"><b>+5점</b><span>일반 게시글 작성</span></div>
    <div class="rule"><b>+2점</b><span>유의미 댓글·대댓글</span></div>
    <div class="rule"><b>0점</b><span>가입인사 글 / 단순 반응</span></div>
    <div class="rule"><b>제외</b><span>카페장 ‘인간’ 활동</span></div>
  </div>
</section>

<div id="error"></div>
<footer id="footer">회원전용 게시글·댓글 원문은 외부 대시보드에 공개하지 않음</footer>
</div>

<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const medals=["🥇","🥈","🥉"];
const cls=["gold","silver","bronze"];

function render(data){
  const rows=data.rankings||[];
  const label=data.label||data.month||"";
  document.getElementById("title").textContent=label.replace("년 ","년 ").replace("월","월의")+" 방역왕 👑";
  document.getElementById("month").textContent=(data.month||"").replace("-",".");
  document.getElementById("top3").innerHTML=rows.slice(0,3).map((r,i)=>`
    <article class="podium ${cls[i]}">
      <div class="rank">${medals[i]} ${r.rank}위</div>
      <div class="name">${esc(r.name)}</div>
      <div><span class="score">${r.score}</span><span class="unit">점</span></div>
      <div class="meta"><span class="chip">게시글 ${r.posts}</span><span class="chip">유의미 댓글 ${r.meaningful_comments}</span></div>
    </article>`).join("");

  document.getElementById("ranking-body").innerHTML=rows.map(r=>`
    <tr>
      <td class="rno">${r.rank}</td>
      <td class="member">${esc(r.name)}<div class="stats-mobile">게시글 ${r.posts} · 유의미 ${r.meaningful_comments} · 전체 ${r.total_comments}</div></td>
      <td class="points">${r.score}</td>
      <td>${r.posts}</td>
      <td>${r.meaningful_comments}</td>
      <td>${r.total_comments}</td>
      <td>${r.rank<=3?"—":`<span class="gap">${r.gap_to_3rd}점</span>`}</td>
    </tr>`).join("");

  const prev=data.previous_month||{};
  document.getElementById("prev-label").textContent=prev.label||"";
  document.getElementById("history").innerHTML=(prev.top3||[]).map((r,i)=>`
    <div class="hist"><div class="h-rank">${medals[i]} ${r.rank}위</div><div class="h-name">${esc(r.name)}</div></div>`).join("");

  document.getElementById("footer").innerHTML=
    `집계기간 ${esc(data.month||"")} · 회원전용 게시글·댓글 원문은 외부 대시보드에 공개하지 않음<br>업데이트 ${esc(data.updated_at||"")}`;
}

fetch("./data/latest.json",{cache:"no-store"})
  .then(r=>{if(!r.ok)throw new Error("latest.json load failed");return r.json()})
  .then(render)
  .catch(err=>{
    document.getElementById("error").innerHTML='<div class="error">대시보드 데이터를 불러오지 못했습니다. 잠시 후 새로고침해주세요.</div>';
    console.error(err);
  });
</script>
</body>
</html>
